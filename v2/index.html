<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique Order-to-Billing · POC</title>
<style>
:root{--bg:#f6f2ec;--panel:#fff;--ink:#2b2226;--muted:#7d7074;--line:#e7ded6;--accent:#7a2948;--accent-soft:#f4e6ec;--gold:#a8741a;--ok:#2e7d4f;--ok-soft:#e5f3ea;--warn:#a56300;--warn-soft:#fbf0dc;--bad:#b3261e;--bad-soft:#fbe6e4;--info:#2f5d8a;--info-soft:#e6eef7}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
nav.side{width:215px;background:#2b1a22;color:#eadfe3;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
.brand{font-family:Georgia,serif;font-size:19px;color:#fff;padding:4px 10px 14px;line-height:1.2}
.brand small{display:block;font:11px system-ui;color:#c9b3bd;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
nav.side a{display:flex;justify-content:space-between;align-items:center;color:#eadfe3;text-decoration:none;padding:9px 10px;border-radius:8px;margin:2px 0}
nav.side a:hover{background:#3d2631}
nav.side a.on{background:var(--accent);color:#fff}
nav.side .foot{font-size:11px;color:#a8939c;padding:16px 10px 0;line-height:1.5}
.badge{background:#e0453a;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
main{flex:1;padding:22px 28px 70px;min-width:0}
h1{font-family:Georgia,serif;font-weight:normal;font-size:26px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row+.row{margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1050px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:21px;font-weight:600;margin-top:2px}
.kpi span{color:var(--muted);font-size:12px}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#faf7f3;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf6f8}
table.ed td{padding:4px}
input,select,textarea{font:inherit;color:inherit;border:1px solid #d9cec5;border-radius:7px;padding:6px 8px;background:#fff;width:100%}
input[type=checkbox]{width:auto;padding:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
td input,td select{padding:4px 6px}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
label.inline{display:inline-flex;gap:5px;align-items:center;color:var(--ink);font-size:13px;margin:0 10px 0 0}
.f{flex:1;min-width:140px}
.f.s{flex:0 0 120px;min-width:100px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.pri:hover{background:#621f39}
.sm{padding:3px 9px;font-size:12px}
.ghost{background:none;border-color:transparent;color:var(--muted)}
.danger{color:var(--bad)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#eee;white-space:nowrap;font-family:system-ui}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--info-soft);color:var(--info)} .c-acc{background:var(--accent-soft);color:var(--accent)} .c-mut{background:#efebe7;color:var(--muted)}
.muted{color:var(--muted)} .right{text-align:right} .sp{flex:1} .acc{color:var(--accent)}
.bar{height:8px;background:#efe7e0;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.ok{background:var(--ok)}
.note{background:#fbf8f4;border:1px dashed #dccfc4;border-radius:8px;padding:10px 12px;margin-top:10px}
.style-note{background:#fff8e6;border-left:3px solid var(--gold);padding:8px 12px;border-radius:6px;margin:8px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.req{color:var(--bad);text-transform:none;letter-spacing:0;font-weight:normal}
.itemno{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.msec{margin-bottom:8px}
.msec-t{font-weight:600;font-size:12.5px;margin:4px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.isum{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;background:#faf6f1;border-radius:8px;padding:10px 12px;margin-top:12px}
.isum span{display:block;font-size:11.5px;color:var(--muted)}
.isum b{font-size:14px}
tr.ext td{background:#f7f5fb}
.osum{position:sticky;bottom:0;box-shadow:0 -6px 20px rgba(43,26,34,.08);border-color:#d9c6cf}
.sumgrid{display:flex;gap:22px;flex-wrap:wrap}
.sumgrid span{display:block;font-size:11.5px;color:var(--muted)}
.sumgrid b{font-size:16px}
.est{margin-top:12px;padding:10px 12px;border-radius:8px}
.est.ok{background:var(--ok-soft)} .est.bad{background:var(--bad-soft)}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.ok{background:var(--ok-soft)} .banner.info{background:var(--info-soft)} .banner.bad{background:var(--bad-soft)}
.stepper{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0 10px}
.step{padding:4px 10px;border-radius:14px;font-size:12px;border:1px solid var(--line);background:#fff}
.step.done{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.step.active{background:var(--accent);border-color:var(--accent);color:#fff}
.step.ext{border-style:dashed}
.arrow{color:#c8b9b0}
/* gantt */
.gantt{position:relative;font-size:12px}
.g-row{display:flex;align-items:center;border-bottom:1px solid #f1ebe5;min-height:26px}
.g-lab{width:250px;flex-shrink:0;padding:3px 8px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;flex:1;height:24px}
.g-bar{position:absolute;top:5px;height:14px;border-radius:4px;background:#c9a3b4}
.g-bar.done{background:#9ccfb0} .g-bar.prog{background:var(--accent)} .g-bar.ext{background:repeating-linear-gradient(45deg,#9fb6d1,#9fb6d1 4px,#b8cbe0 4px,#b8cbe0 8px)} .g-bar.late{outline:2px solid var(--bad)}
.g-head{display:flex;border-bottom:1px solid var(--line)}
.g-head .g-track{height:20px}
.g-tick{position:absolute;top:2px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.g-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--info);z-index:2}
.g-line.prom{border-left:2px dashed var(--bad)}
.g-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.g-legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#efe8e1;border-radius:12px;min-width:240px;width:240px;padding:10px;flex-shrink:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600}
.col-h small{font-weight:normal;color:var(--muted)}
.jc-card{background:#fff;border-radius:9px;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);border-left:4px solid #c9a3b4;cursor:pointer;font-size:12.5px}
.jc-card.prog{border-left-color:var(--accent)} .jc-card.risk{border-left-color:var(--bad)} .jc-card.ext{border-left-color:var(--info)}
.jc-card .t{font-weight:600}
/* heat */
.heat td{text-align:center;font-size:11px;padding:5px 2px;border:1px solid #fff}
/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:8px;border-left:5px solid #ccc}
.alert.critical{border-left-color:#8c1d18} .alert.high{border-left-color:var(--bad)} .alert.medium{border-left-color:var(--warn)}
.alert .b{flex:1}
.alert .t{font-weight:600}
/* modal */
#modal{position:fixed;inset:0;background:rgba(30,15,22,.45);display:none;align-items:flex-start;justify-content:center;padding:30px;overflow:auto;z-index:50}
#modal.on{display:flex}
#ask{position:fixed;inset:0;background:rgba(30,15,22,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:70}
#ask.on{display:flex}
.mbox{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
/* invoice */
.inv{font-size:13px;color:#222}
.inv-h{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid var(--accent);padding-bottom:12px}
.inv-shop{font-family:Georgia,serif;font-size:24px;color:var(--accent)}
.inv-title{font-size:18px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.inv-to{margin:14px 0}
.inv-t th{background:#f7eff2}
.inv-t .bd td{border:none;padding:1px 0;font-size:11.5px;color:#666}
.inv-foot{display:flex;gap:24px;justify-content:space-between;margin-top:14px}
.inv-words{flex:1}
.inv-tot{width:300px}
.inv-tot td{padding:4px 8px}
.inv-tot .grand td{font-weight:700;font-size:15px;border-top:2px solid #333}
.inv-tot .bal td{font-weight:700;color:var(--accent)}
.terms{margin-top:14px;font-size:11.5px}
.sign{text-align:right;margin-top:30px}
.jc{border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:16px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;pointer-events:none;align-items:center;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#2b1a22;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
.empty{padding:30px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);margin:6px 0}
/* v2 */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.dcard:hover{border-color:var(--accent)}
.dimg{aspect-ratio:4/3;background:#f1ebe5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#c8b9b0;font-size:30px}
.dcard .b{padding:10px 12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;background:#f1ebe5 center/cover no-repeat;border:1px solid var(--line);cursor:zoom-in}
.thumb.cover{outline:3px solid var(--gold);outline-offset:1px}
.thumb.missing::after{content:'missing';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.tbtn{position:absolute;top:4px;padding:0 6px;font-size:11px;line-height:20px;border-radius:6px;background:rgba(255,255,255,.92);opacity:0;transition:opacity .15s}
.thumb:hover .tbtn{opacity:1}
.tbtn.x{right:4px;color:var(--bad)} .tbtn.star{left:4px;color:var(--gold)}
.spin{background:#f4eef0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.spin img{display:block;width:100%;height:360px;object-fit:contain;cursor:grab;user-select:none;touch-action:pan-y}
.spin img:active{cursor:grabbing}
.spin-ui{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#fff;border-top:1px solid var(--line)}
.spin-ui input{flex:1}
.dbar{display:flex;gap:12px;align-items:center;background:#faf6f1;border-radius:10px;padding:8px 10px;margin-top:12px;flex-wrap:wrap}
.dthumb{width:56px;height:56px;border-radius:8px;background:#efe7e0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#c8b9b0;font-size:20px;cursor:pointer;flex-shrink:0}
.logo-box{width:140px;height:84px;border:1px dashed #d9cec5;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;padding:6px}
.logo-box img{max-width:100%;max-height:100%}
.brand img{max-height:52px;max-width:160px;display:block;margin-bottom:10px;border-radius:6px}
.comms{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.comms{grid-template-columns:1fr}}
.tli{padding:9px 10px;border-radius:8px;cursor:pointer}
.tli:hover{background:#faf6f1} .tli.on{background:var(--accent-soft)}
.ph{margin:2px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.msg-prev{white-space:pre-wrap;background:#dcf8c6;border-radius:12px 12px 12px 3px;padding:12px 14px;max-width:480px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
@media print{
  body{background:#fff}
  .app,.no-print,#toasts,#ask{display:none!important}
  #modal{position:static;background:none;padding:0;display:block!important}
  .mbox{box-shadow:none;max-width:none;width:auto;padding:0}
  .jc{page-break-after:always;border:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="ask" onclick="if(event.target===this)this.classList.remove('on')"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   Boutique Order-to-Billing — POC
   Single-file app. Data lives in the browser's localStorage.
   Flow: Customer & measurements → style preferences → pieces & materials
         → work plan (workers, pricing) → bandwidth-based delivery estimate
         → production tracking & bottleneck alerts → invoice.
   ===================================================================== */
const STORE = 'boutique_o2b_poc_v1';
const CPLX = {Simple:1, Medium:1.5, Heavy:2, Couture:3};
let DB = null, SC = null, HOL = null, EDIT = null, SETUP_TPL = 0, ORD_FILTER = 'open', ORD_Q = '';

/* ---------------- utilities ---------------- */
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v = x => h(x ?? '');
const num = x => { const n = parseFloat(x); return isNaN(n) ? 0 : n; };
const r2 = x => Math.round(num(x) * 100) / 100;
const inr = x => '₹' + Math.round(num(x)).toLocaleString('en-IN');
const inr2 = x => '₹' + num(x).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = p => (p || '') + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const nowISO = () => new Date().toISOString();
function iso(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
const todayISO = () => iso(new Date());
function parseD(s){ return new Date(String(s).length === 10 ? s + 'T00:00:00' : s); }
function fmtD(s){ if(!s) return '—'; return parseD(s).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
function fmtDT(s){ if(!s) return '—'; return parseD(s).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); }
function sod(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const opt = (val, label, cur) => `<option value="${h(val)}" ${String(val) === String(cur ?? '') ? 'selected' : ''}>${h(label)}</option>`;
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, val){ const ks = p.split('.'); let x = o; for(let i = 0; i < ks.length - 1; i++) x = x[ks[i]]; x[ks[ks.length-1]] = val; }
function toast(msg, type){ const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4200); }
function words(n){
  n = Math.floor(num(n)); if(n === 0) return 'Zero';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x/100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  let s = ''; const cr = Math.floor(n / 1e7); n %= 1e7; const l = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
  if(cr) s += (cr >= 100 ? words(cr) : two(cr)) + ' Crore ';
  if(l) s += two(l) + ' Lakh '; if(th) s += two(th) + ' Thousand '; if(n) s += three(n);
  return s.trim();
}
function waLink(phone, text){ let d = String(phone || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d; return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; }
function openWA(phone, text){ window.open(waLink(phone, text), '_blank'); }

/* ---------------- lookups ---------------- */
const ST = () => DB.settings;
const stage = id => DB.stages.find(s => s.id === id) || {id, name:id || '?', seq:99, type:'internal', rate:0};
const worker = id => DB.workers.find(w => w.id === id);
const tpl = id => DB.templates.find(t => t.id === id);
const cust = id => DB.customers.find(c => c.id === id);
const ord = id => DB.orders.find(o => o.id === id);
const inv = id => DB.invoices.find(i => i.id === id);
const openOrders = () => DB.orders.filter(o => o.status === 'open');
const bySeq = (a, b) => num(a.seq) - num(b.seq);
const sched = () => SC || (SC = schedule());

/* ---------------- working calendar ---------------- */
function holidays(){ return HOL || (HOL = new Set(String(ST().holidays || '').split(',').map(x => x.trim()).filter(Boolean))); }
function isOff(d){ return (ST().weeklyOff || []).includes(new Date(d).getDay()) || holidays().has(iso(d)); }
function day0(){ let d = sod(new Date()), g = 0; while(isOff(d) && g++ < 14) d = addDays(d, 1); return d; }
function idxDate(n){ // working-day index -> calendar date (0 = today or next working day)
  let d = day0(), k = Math.floor(n), g = 0;
  if(k >= 0){ while(k > 0 && g++ < 2000){ d = addDays(d, 1); if(!isOff(d)) k--; } }
  else { k = -k; while(k > 0 && g++ < 2000){ d = addDays(d, -1); if(!isOff(d)) k--; } }
  return d;
}
function workIndex(date){ // calendar date -> working-day index relative to day0
  const t = sod(date), z = day0(); let n = 0, d = new Date(z), g = 0;
  if(t >= z){ while(d < t && g++ < 2000){ d = addDays(d, 1); if(!isOff(d)) n++; } return n; }
  while(d > t && g++ < 2000){ d = addDays(d, -1); if(!isOff(d)) n--; } return n;
}
const startDate = x => idxDate(Math.max(0, Math.floor(x)));
const endDate = x => idxDate(Math.max(0, Math.ceil(x) - 1));
function addWorkDays(date, n){ let d = sod(date), k = Math.ceil(num(n)), g = 0; while(k > 0 && g++ < 2000){ d = addDays(d, 1); if(!isOff(d)) k--; } return d; }
function elapsedHrs(startISO, cap){
  if(!startISO) return 0; const s = new Date(startISO), n = new Date();
  if(sod(s).getTime() === sod(n).getTime()) return Math.min(cap, Math.max(0, (n - s) / 36e5));
  let days = 0, d = sod(s), g = 0; while(g++ < 2000){ d = addDays(d, 1); if(d > sod(n)) break; if(!isOff(d)) days++; }
  return days * cap;
}

/* ---------------- costing ---------------- */
function taskHours(t, it){ return num(t.hours) * (num(it.qty) || 1); }
function taskAmount(t, it){
  const q = num(it.qty) || 1;
  if(t.mode === 'external') return num(t.extCost) * q;
  if(t.pricing === 'hour') return num(t.hours) * num(t.rate) * (CPLX[t.cplx] || 1) * q;
  if(t.pricing === 'fixed') return num(t.rate) * q;
  return num(t.units) * num(t.rate) * q; // per piece / unit
}
function itemCost(it){
  const q = num(it.qty) || 1;
  const mat = it.components.reduce((a, c) => a + num(c.qty) * num(c.rate), 0) * q;
  const lab = it.tasks.filter(t => t.mode !== 'external').reduce((a, t) => a + taskAmount(t, it), 0);
  const ext = it.tasks.filter(t => t.mode === 'external').reduce((a, t) => a + taskAmount(t, it), 0);
  return {mat: r2(mat), lab: r2(lab), ext: r2(ext), total: r2(mat + lab + ext)};
}
function itemPrice(it, o){ const c = itemCost(it).total; return num(it.priceOverride) > 0 ? r2(it.priceOverride) : r2(c * (1 + num(o.markup) / 100)); }
const paidOf = o => r2((o.payments || []).reduce((a, p) => a + num(p.amount), 0));
function orderTotals(o){
  let cost = 0, sub = 0; o.items.forEach(it => { cost += itemCost(it).total; sub += itemPrice(it, o); });
  const disc = r2(o.discount), taxable = Math.max(0, r2(sub - disc)), gst = r2(taxable * num(o.gstPct) / 100), total = r2(taxable + gst), paid = paidOf(o);
  return {cost: r2(cost), sub: r2(sub), disc, taxable, gst, total, paid, bal: r2(total - paid), margin: r2(taxable - cost)};
}

/* ---------------- scheduling (bandwidth-based) ----------------
   Time unit = working days from today (day 0). Each worker has a cursor
   (when they become free). Tasks of an item run in stage-sequence groups;
   tasks with the same sequence run in parallel; a group starts when the
   previous group finishes. In-progress work is queued first; orders are
   then taken by priority → promised date → order date.            */
function groupTasks(it){
  const m = new Map();
  it.tasks.map((t, j) => ({t, j})).sort((a, b) => stage(a.t.stage).seq - stage(b.t.stage).seq || a.j - b.j)
    .forEach(({t}) => { const k = stage(t.stage).seq; if(!m.has(k)) m.set(k, []); m.get(k).push(t); });
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function sortedTasks(it){ return it.tasks.map((t, j) => ({t, j})).sort((a, b) => stage(a.t.stage).seq - stage(b.t.stage).seq || a.j - b.j); }
function remHours(t, it, w){
  const H = taskHours(t, it); if(t.status !== 'in_progress') return H;
  const el = elapsedHrs(t.startedAt, num(w?.hoursPerDay) || 8); return Math.max(H - el, H * 0.1, 0.25);
}
function pickWorker(stageId, cursor){
  const c = DB.workers.filter(w => w.active !== false && (w.skills || []).includes(stageId));
  if(!c.length) return null; return c.sort((a, b) => (cursor[a.id] || 0) - (cursor[b.id] || 0))[0].id;
}
function schedule(extra){
  let orders = openOrders();
  if(extra){ orders = orders.filter(o => o.id !== extra.id); orders.push(extra); }
  const P = {urgent:0, high:1, normal:2};
  orders = orders.slice().sort((a, b) => (P[a.priority] ?? 2) - (P[b.priority] ?? 2) || String(a.promised || '9').localeCompare(String(b.promised || '9')) || String(a.created).localeCompare(String(b.created)));
  const cursor = {}, T = {}, O = {};
  // pass 1 — work already on the bench occupies its worker first
  for(const o of orders) for(const it of o.items) for(const t of it.tasks){
    if(t.mode === 'internal' && t.status === 'in_progress'){
      const wid = t.workerId || pickWorker(t.stage, cursor); if(!wid) continue;
      const w = worker(wid); const s = cursor[wid] || 0; const e = s + remHours(t, it, w) / (num(w.hoursPerDay) || 8);
      cursor[wid] = e; T[t.id] = {s: Math.min(s, workIndex(t.startedAt)), segS: s, e, wid, auto: !t.workerId};
    }
  }
  // pass 2 — plan the rest
  for(const o of orders){
    let oEnd = 0, last = null;
    for(const it of o.items){
      let prev = 0;
      for(const g of groupTasks(it)){
        let gEnd = prev;
        for(const t of g){
          if(t.status === 'done'){ const e = t.doneAt ? workIndex(t.doneAt) + 0.5 : prev; T[t.id] = {s: e, e, done: true}; gEnd = Math.max(gEnd, e); continue; }
          if(t.mode === 'external'){
            const s = t.status === 'in_progress' ? workIndex(t.startedAt) : prev; const e = s + Math.max(0.5, num(t.tatDays) || 1);
            T[t.id] = {s, e, ext: true}; if(e >= gEnd){ gEnd = e; } if(!last || e > last.e) last = {t, it, e}; continue;
          }
          if(t.status === 'in_progress' && T[t.id]){ gEnd = Math.max(gEnd, T[t.id].e); if(!last || T[t.id].e > last.e) last = {t, it, e: T[t.id].e}; continue; }
          const wid = t.workerId || pickWorker(t.stage, cursor);
          if(!wid){ T[t.id] = {s: prev, e: prev, none: true}; continue; }
          const w = worker(wid); const s = Math.max(cursor[wid] || 0, prev); const e = s + remHours(t, it, w) / (num(w.hoursPerDay) || 8);
          cursor[wid] = e; T[t.id] = {s, segS: s, e, wid, auto: !t.workerId, wait: s - prev};
          gEnd = Math.max(gEnd, e); if(!last || e > last.e) last = {t, it, e};
        }
        prev = Math.max(0, gEnd);
      }
      oEnd = Math.max(oEnd, prev);
    }
    const del = iso(endDate(oEnd + num(ST().qcBufferDays)));
    O[o.id] = {end: oEnd, delivery: del, risk: !!(o.promised && del > o.promised), last};
  }
  return {T, O, cursor};
}

/* ---------------- workload & stage stats ---------------- */
function workerStats(){
  const sc = sched(), out = {};
  DB.workers.forEach(w => out[w.id] = {hrs: 0, tasks: [], days: sc.cursor[w.id] || 0});
  openOrders().forEach(o => o.items.forEach(it => it.tasks.forEach(t => {
    if(t.mode !== 'internal' || t.status === 'done') return;
    const x = sc.T[t.id]; const wid = t.workerId || x?.wid; if(!wid || !out[wid]) return;
    out[wid].hrs += remHours(t, it, worker(wid)); out[wid].tasks.push({o, it, t, x});
  })));
  Object.values(out).forEach(s => s.tasks.sort((a, b) => (a.x?.s || 0) - (b.x?.s || 0)));
  return out;
}
function stageStats(){
  const out = {}; DB.stages.forEach(s => out[s.id] = {hrs: 0, n: 0, cap: 0, out: 0, workers: 0});
  DB.workers.filter(w => w.active !== false).forEach(w => (w.skills || []).forEach(sid => { if(out[sid]){ out[sid].cap += num(w.hoursPerDay) || 8; out[sid].workers++; } }));
  openOrders().forEach(o => o.items.forEach(it => it.tasks.forEach(t => {
    if(t.status === 'done' || !out[t.stage]) return; const s = out[t.stage]; s.n++;
    if(t.mode === 'external'){ if(t.status === 'in_progress') s.out++; } else s.hrs += remHours(t, it, worker(t.workerId) || {hoursPerDay: 8});
  })));
  Object.values(out).forEach(s => s.days = s.cap ? s.hrs / s.cap : (s.hrs ? Infinity : 0));
  return out;
}
function currentGroup(it){ return groupTasks(it).find(g => g.some(t => t.status !== 'done')) || null; }
function progress(o){
  let tot = 0, d = 0;
  o.items.forEach(it => it.tasks.forEach(t => { const w = t.mode === 'external' ? Math.max(1, num(t.tatDays)) * 4 : Math.max(0.25, taskHours(t, it)); tot += w; if(t.status === 'done') d += w; else if(t.status === 'in_progress') d += w * 0.4; }));
  return o.status !== 'open' && o.status !== 'cancelled' ? 100 : (tot ? Math.round(d / tot * 100) : 0);
}
const statusLabel = o => ({open:'In production', ready:'Ready for pickup', delivered:'Delivered', cancelled:'Cancelled'}[o.status] || o.status);
const statusCls = o => ({open:'c-acc', ready:'c-ok', delivered:'c-mut', cancelled:'c-bad'}[o.status] || '');
function curStage(o){
  if(o.status !== 'open') return statusLabel(o);
  const names = new Set(); o.items.forEach(it => { const g = currentGroup(it); if(g) g.filter(t => t.status !== 'done').forEach(t => names.add(stage(t.stage).name)); });
  return names.size ? [...names].join(', ') : 'Final QC';
}
const prioChip = p => p === 'urgent' ? '<span class="chip c-bad">Urgent</span>' : p === 'high' ? '<span class="chip c-warn">High</span>' : '';
function taskChip(t){ return t.status === 'done' ? '<span class="chip c-ok">Done</span>' : t.status === 'in_progress' ? `<span class="chip c-acc">${t.mode === 'external' ? 'At vendor' : 'In progress'}</span>` : '<span class="chip c-mut">Pending</span>'; }

/* ---------------- bottleneck & alert engine ---------------- */
function allAlerts(){
  const sc = sched(), s = ST(), A = [], today = todayISO();
  const add = (key, sev, title, detail, oid) => A.push({key, sev, title, detail, oid});
  for(const o of openOrders()){
    const c = cust(o.customerId) || {}; const tag = `${o.no} (${c.name || '—'})`; const est = sc.O[o.id];
    if(o.promised && o.promised < today) add('late:' + o.id, 'critical', 'Order past promised date', `${tag} was promised for ${fmtD(o.promised)} and is still in production (${curStage(o)}).`, o.id);
    else if(est && est.risk){ const l = est.last; add('risk:' + o.id, 'high', 'Delivery at risk', `${tag}: tentative delivery ${fmtD(est.delivery)} is after promised ${fmtD(o.promised)}.` + (l ? ` Critical step: ${stage(l.t.stage).name} – ${l.t.piece}${l.t.mode === 'internal' ? ' (' + (worker(l.t.workerId || sc.T[l.t.id]?.wid)?.name || 'unassigned') + ')' : ''}.` : ''), o.id); }
    for(const it of o.items){
      const groups = groupTasks(it);
      groups.forEach((g, gi) => g.forEach(t => {
        const lbl = `${stage(t.stage).name} – ${t.piece || it.title}`;
        if(t.status === 'in_progress' && t.mode === 'internal'){
          const w = worker(t.workerId); const el = elapsedHrs(t.startedAt, num(w?.hoursPerDay) || 8), H = taskHours(t, it);
          if(H && el > H * (1 + num(s.overrunPct) / 100)) add('overrun:' + t.id, 'high', 'Task overrunning', `${lbl} for ${tag} by ${w?.name || '—'}: ~${el.toFixed(1)} h elapsed vs ${H} h estimated.`, o.id);
        }
        if(t.status === 'in_progress' && t.mode === 'external'){
          const ret = iso(addWorkDays(t.startedAt, t.tatDays || 1));
          if(ret < today) add('ext:' + t.id, 'high', 'External work overdue', `${lbl} for ${tag} at ${t.vendor || 'vendor'} was due back on ${fmtD(ret)}.`, o.id);
        }
        if(t.status === 'pending'){
          if(t.mode === 'internal' && sc.T[t.id]?.none) add('noworker:' + t.id, 'critical', 'No worker with this skill', `${lbl} for ${tag} cannot be scheduled — no active worker has the "${stage(t.stage).name}" skill.`, o.id);
          else if(t.mode === 'internal' && !t.workerId) add('unassigned:' + t.id, 'medium', 'Task not assigned', `${lbl} for ${tag} has no worker assigned (planned on ${worker(sc.T[t.id]?.wid)?.name || '—'}).`, o.id);
          const prevDone = groups.slice(0, gi).every(pg => pg.every(x => x.status === 'done'));
          const groupStarted = g.some(x => x.status !== 'pending');
          if(prevDone && !groupStarted && g.indexOf(t) === 0){
            const ds = groups.slice(0, gi).flat().map(x => x.doneAt).filter(Boolean).sort();
            const since = ds.length ? ds[ds.length - 1] : o.created; const wait = -workIndex(since);
            if(wait > num(s.idleDays)) add('idle:' + t.id, 'medium', 'Hand-off delay', `${g.length > 1 ? stage(t.stage).name + ' (' + g.length + ' tasks)' : lbl} for ${tag} is ready to start but has been waiting ${wait} working days${gi ? ' since the previous step finished' : ' since the order was booked'}.`, o.id);
          }
        }
      }));
    }
  }
  const ws = workerStats();
  DB.workers.filter(w => w.active !== false).forEach(w => { const d = ws[w.id].days; if(d > num(s.overloadDays)) add('overload:' + w.id, 'medium', 'Worker overloaded', `${w.name} has ${d.toFixed(1)} working days of queued work (threshold ${s.overloadDays} days).`); });
  const ss = stageStats();
  DB.stages.filter(x => x.type === 'internal').forEach(x => { const q = ss[x.id];
    if(q.hrs && !q.cap) add('stagecap:' + x.id, 'critical', 'Stage has no capacity', `${q.hrs.toFixed(1)} h of ${x.name} work queued but no active worker has this skill.`);
    else if(q.days > num(s.stageQueueDays)) add('stage:' + x.id, 'high', 'Stage bottleneck', `${x.name} queue is ${q.days.toFixed(1)} working days (${q.hrs.toFixed(1)} h across ${q.workers} worker${q.workers > 1 ? 's' : ''}). Consider overtime, another worker or outsourcing.`);
  });
  const rank = {critical:0, high:1, medium:2};
  return A.sort((a, b) => rank[a.sev] - rank[b.sev]);
}
const activeAlerts = () => allAlerts().filter(a => !DB.ack[a.key]);
const sevChip = s => `<span class="chip ${s === 'critical' ? 'c-bad' : s === 'high' ? 'c-bad' : 'c-warn'}">${s}</span>`;
function checkNotify(){
  try{
    const A = activeAlerts(); const fresh = A.filter(a => !DB.notified[a.key]);
    if(!fresh.length) return;
    fresh.forEach(a => DB.notified[a.key] = Date.now()); save();
    toast(`⚠ ${fresh.length} new bottleneck alert${fresh.length > 1 ? 's' : ''} for admin — see Alerts`, 'bad');
    if('Notification' in window && Notification.permission === 'granted') fresh.slice(0, 3).forEach(a => new Notification('Boutique alert: ' + a.title, {body: a.detail}));
  }catch(e){ console.warn(e); }
}

function pushMeas(cid, it, o){
  const c = cust(cid); if(!c) return; c.measHistory = c.measHistory || [];
  const rec = {itemId: it.id, tplId: it.tplId, date: o.created, orderNo: o.no, values: clone(it.meas)};
  const k = c.measHistory.findIndex(x => x.itemId === it.id); if(k >= 0) c.measHistory[k] = rec; else c.measHistory.push(rec);
}
function lastMeas(cid, tplId){ const c = cust(cid); if(!c) return null; const hs = (c.measHistory || []).filter(x => x.tplId === tplId); return hs.length ? hs[hs.length - 1].values : null; }
function newItem(tplId, cid){ const it = {id: uid('it'), tplId, title: '', qty: 1, meas: {}, style: '', components: [], tasks: [], priceOverride: ''}; applyTemplate(it, cid); return it; }
function applyTemplate(it, cid){
  const t = tpl(it.tplId); if(!t) return;
  it._tpl = it.tplId; it.title = t.name; it.designId = '';
  it.components = t.components.map(c => ({...clone(c), id: uid('c')}));
  it.tasks = t.tasks.map(x => ({...clone(x), id: uid('t'), workerId: '', status: 'pending', startedAt: null, doneAt: null}));
  const last = lastMeas(cid, it.tplId) || {}; const m = {}; t.fields.forEach(f => m[f.k] = last[f.k] ?? ''); it.meas = m;
}
function makeInvoice(o, date, existing){
  const t = orderTotals(o);
  const lines = o.items.map(it => {
    const cost = itemCost(it).total, price = itemPrice(it, o), f = cost ? price / cost : 0, q = num(it.qty) || 1;
    return {desc: it.title || tpl(it.tplId)?.name, type: (tpl(it.tplId)?.name || '') + (design(it.designId) ? ` · Design: ${design(it.designId).name} (${design(it.designId).code})` : ''), qty: q, rate: r2(price / q), amount: price,
      details: [...it.components.map(c => ({d: `${c.name} (${c.qty} ${c.unit}${q > 1 ? ' × ' + q : ''})`, a: r2(num(c.qty) * num(c.rate) * q * f)})),
                ...sortedTasks(it).map(({t: x}) => ({d: `${stage(x.stage).name} – ${x.piece || ''}${x.mode === 'internal' && x.pricing === 'hour' ? ` (${x.hours} h, ${x.cplx})` : ''}`, a: r2(taskAmount(x, it) * f)}))]};
  });
  const tax = t.gst, cg = r2(tax / 2);
  const inv0 = {id: existing?.id || uid('i'), no: existing?.no || (ST().invPrefix + String(ST().nextInv++).padStart(4, '0')), orderId: o.id, date: date || todayISO(), lines, sub: t.sub, discount: t.disc, gstPct: num(o.gstPct), tax, cgst: cg, sgst: r2(tax - cg), total: t.total, taxMode: ST().taxMode, breakdown: existing?.breakdown || false};
  if(existing){ Object.assign(existing, inv0); return existing; }
  DB.invoices.push(inv0); o.invoiceId = inv0.id; o.log.push({at: date ? date + 'T12:00:00' : nowISO(), msg: `Invoice ${inv0.no} generated`}); return inv0;
}

/* ---------------- binding (inputs ↔ data) ---------------- */
document.addEventListener('input', e => bind(e, false));
document.addEventListener('change', e => bind(e, true));
function bind(e, isChange){
  const el = e.target, p = el.dataset && el.dataset.p; if(!p) return;
  const rootName = el.dataset.root || 'EDIT', root = rootName === 'DB' ? DB : EDIT; if(!root) return;
  if(!isChange && (el.tagName === 'SELECT' || el.type === 'checkbox')) return;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if(el.type === 'number') val = el.value === '' ? '' : num(el.value);
  setPath(root, p, val); hooks(rootName, root, p, val);
  if(rootName === 'DB') save();
  if(isChange && el.dataset.r !== undefined) render(); else if(rootName === 'EDIT') refreshLive();
}
function hooks(rootName, root, p, val){
  let m;
  if((m = p.match(/^(.*tasks\.\d+)\.stage$/i))){
    const t = getPath(root, m[1]), s = stage(val); t.mode = s.type;
    if(s.type === 'external'){ t.extCost = t.extCost ?? 0; t.tatDays = t.tatDays || 1; t.vendor = t.vendor || ''; }
    else { t.pricing = t.pricing || 'unit'; if(t.units === '' || t.units == null) t.units = 1; if(!num(t.rate) && num(s.rate)) t.rate = s.rate; if(!num(t.hours)) t.hours = 1; if(t.workerId && !(worker(t.workerId)?.skills || []).includes(val)) t.workerId = ''; }
  }
  if((m = p.match(/^(.*tasks\.\d+)\.workerId$/i))){ const t = getPath(root, m[1]), w = worker(val); if(w && t.pricing === 'hour') t.rate = w.rate; }
  if((m = p.match(/^(.*tasks\.\d+)\.pricing$/i))){ const t = getPath(root, m[1]); if(val === 'hour'){ const w = worker(t.workerId); t.rate = w ? w.rate : (num(stage(t.stage).rate) || t.rate); t.cplx = t.cplx || 'Simple'; } if(val === 'unit' && (t.units === '' || t.units == null)) t.units = 1; }
  if(rootName === 'EDIT'){
    if((m = p.match(/^items\.(\d+)\.tplId$/))){
      const it = EDIT.items[m[1]];
      if(it._tpl && it._tpl !== val){ it.tplId = it._tpl; ask('Changing the apparel type reloads measurements, pieces and the work plan from the template. Continue?', () => { it.tplId = val; applyTemplate(it, EDIT.customerId); render(); }); }
      else applyTemplate(it, EDIT.customerId);
    }
    if(p === 'customerId' && val && val !== '__new') EDIT.items.forEach(it => { const last = lastMeas(val, it.tplId); if(last && Object.values(it.meas).every(x => !String(x).trim())) Object.assign(it.meas, last); });
  }
}

function gantt(o){

}

}

/* ---------- workers & workload ---------- */
function vWorkers(){

  const heat = act.map(w => { const cells = Array(N).fill(0); ws[w.id].tasks.forEach(({x}) => { if(!x || x.none) return; const s = Math.max(0, x.segS ?? x.s), e = x.e; for(let d = Math.floor(s); d < Math.min(N, Math.ceil(e)); d++) cells[d] += Math.max(0, Math.min(e, d + 1) - Math.max(s, d)); }); return {w, cells}; });
  return `<div class="row"><div><h1>Workers & workload</h1><div class="sub">Bandwidth is computed from estimated hours of every open task, each worker's daily capacity and the working calendar.</div></div><span class="sp"></span><a class="btn" href="#setup">Manage workers →</a></div>
  <div class="card"><table><thead><tr><th>Worker</th><th>Skills</th><th class="n">Rate / hr</th><th class="n">Hours / day</th><th class="n">Open tasks</th><th class="n">Queued hrs</th><th class="n">Queue (days)</th><th>Load</th><th>Next free</th></tr></thead><tbody>
  ${act.map(w => `<tr><td><b>${h(w.name)}</b></td><td>${(w.skills || []).map(s => `<span class="chip c-mut">${h(stage(s).name)}</span>`).join(' ')}</td><td class="n">${inr(w.rate)}</td><td class="n">${w.hoursPerDay}</td><td class="n">${ws[w.id].tasks.length}</td><td class="n">${ws[w.id].hrs.toFixed(1)}</td><td class="n">${ws[w.id].days.toFixed(1)}</td><td style="width:140px">${loadBar(ws[w.id].days, maxW)}</td><td>${fmtD(iso(startDate(ws[w.id].days)))}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card"><h3>Booked capacity · next ${N} working days</h3><table class="heat"><thead><tr><th style="text-align:left">Worker</th>${Array.from({length: N}, (_, d) => `<th>${idxDate(d).toLocaleDateString('en-IN', {weekday: 'short', day: 'numeric'})}</th>`).join('')}</tr></thead><tbody>
  ${heat.map(({w, cells}) => `<tr><td style="text-align:left;white-space:nowrap">${h(w.name)}</td>${cells.map(f => `<td style="background:rgba(122,41,72,${Math.min(1, f) * 0.85 + (f > 0 ? 0.08 : 0)});color:${f > 0.55 ? '#fff' : '#555'}">${f > 0 ? Math.round(Math.min(1, f) * 100) + '%' : ''}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  ${act.map(w => `<div class="card"><details ${ws[w.id].tasks.length ? '' : ''}><summary><b>${h(w.name)}</b> — work queue (${ws[w.id].tasks.length} tasks, ${ws[w.id].hrs.toFixed(1)} h)</summary>
    ${ws[w.id].tasks.length ? `<table><thead><tr><th>Order</th><th>Garment</th><th>Stage · piece</th><th class="n">Remaining h</th><th>Planned</th><th>Status</th></tr></thead><tbody>${ws[w.id].tasks.map(({o, it, t, x}) => `<tr class="click" onclick="go('order-${o.id}')"><td>${h(o.no)} ${prioChip(o.priority)}</td><td>${h(it.title)}</td><td>${h(stage(t.stage).name)} · ${h(t.piece)}${!t.workerId ? ' <span class="chip c-warn">auto</span>' : ''}</td><td class="n">${remHours(t, it, w).toFixed(1)}</td><td>${x ? `${fmtD(iso(startDate(x.segS ?? x.s)))} → ${fmtD(iso(endDate(x.e)))}` : '—'}</td><td>${taskChip(t)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Free — no queued work.</div>'}</details></div>`).join('')}`;
}

function toggleOff(d, on){ const w = new Set(ST().weeklyOff || []); on ? w.add(d) : w.delete(d); if(w.size >= 7) return toast('At least one working day is needed', 'bad'); ST().weeklyOff = [...w]; save(); render(); }
function toggleSkill(j, sid, on){ const w = DB.workers[j], s = new Set(w.skills || []); on ? s.add(sid) : s.delete(sid); w.skills = [...s]; save(); }
function addStage(){ DB.stages.push({id: uid('s'), name: 'New stage', seq: Math.max(0, ...DB.stages.map(s => num(s.seq))) + 1, type: 'internal', rate: 0}); save(); render(); }
function rmStage(j){ const s = DB.stages[j]; const used = DB.orders.some(o => o.items.some(it => it.tasks.some(t => t.stage === s.id))) || DB.templates.some(t => t.tasks.some(x => x.stage === s.id)); if(used) return toast(`"${s.name}" is used by orders or templates and can't be removed`, 'bad'); ask(`Remove stage "${s.name}"?`, () => { DB.stages.splice(j, 1); save(); render(); }); }
function addWorker(){ DB.workers.push({id: uid('w'), name: 'New worker', phone: '', skills: [], rate: 100, hoursPerDay: 8, active: true}); save(); render(); }
function rmWorker(j){ const w = DB.workers[j]; const n = openOrders().reduce((a, o) => a + o.items.reduce((b, it) => b + it.tasks.filter(t => t.workerId === w.id && t.status !== 'done').length, 0), 0); ask(`Remove ${w.name}?${n ? ` ${n} open task(s) will become unassigned.` : ''} (Tip: untick Active to keep history.)`, () => { DB.orders.forEach(o => o.items.forEach(it => it.tasks.forEach(t => { if(t.workerId === w.id && t.status !== 'done') t.workerId = ''; }))); DB.workers.splice(j, 1); save(); render(); }); }
function setFields(k, text){ const t = DB.templates[k]; t.fields = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [a, b] = l.includes('|') ? l.split('|').map(x => x.trim()) : ['General', l]; return {k: slug(a + '_' + b), label: b, sec: a}; }); save(); render(); toast('Measurement fields updated', 'ok'); }

/* ---------------- media store (IndexedDB, images & 3D files) ---------------- */
const MEDIA = {db: null, urls: new Map(), mem: new Map()};
function mediaOpen(){
  return new Promise(res => {
    const done = () => res(); setTimeout(done, 2500);
    try{ const r = indexedDB.open('boutique_media_v1', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => { MEDIA.db = r.result; done(); }; r.onerror = done; r.onblocked = done; }catch(e){ done(); }
  });
}
function mediaPut(id, blob){
  MEDIA.mem.set(id, blob); if(MEDIA.urls.has(id)){ URL.revokeObjectURL(MEDIA.urls.get(id)); MEDIA.urls.delete(id); }
  if(!MEDIA.db) return Promise.resolve();
  return new Promise(res => { try{ const tx = MEDIA.db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, id); tx.oncomplete = () => res(); tx.onerror = () => res(); }catch(e){ res(); } });
}
function mediaGet(id){
  if(MEDIA.mem.has(id)) return Promise.resolve(MEDIA.mem.get(id));
  if(!MEDIA.db) return Promise.resolve(null);
  return new Promise(res => { try{ const rq = MEDIA.db.transaction('files').objectStore('files').get(id); rq.onsuccess = () => { if(rq.result) MEDIA.mem.set(id, rq.result); res(rq.result || null); }; rq.onerror = () => res(null); }catch(e){ res(null); } });
}
function mediaUsed(id){ return DB.designs.some(d => [...d.stencils, ...d.samples, ...d.renders, ...d.spin, d.model].includes(id)); }
function mediaDel(id){
  if(!id || id.startsWith('demo:') || mediaUsed(id)) return;
  MEDIA.mem.delete(id); if(MEDIA.urls.has(id)){ URL.revokeObjectURL(MEDIA.urls.get(id)); MEDIA.urls.delete(id); }
  if(MEDIA.db){ try{ MEDIA.db.transaction('files', 'readwrite').objectStore('files').delete(id); }catch(e){} }
}
async function mediaUrl(id){
  if(!id) return ''; if(id.startsWith('demo:')) return demoSvg(id);
  if(MEDIA.urls.has(id)) return MEDIA.urls.get(id);
  const b = await mediaGet(id); if(!b) return '';
  const u = URL.createObjectURL(b); MEDIA.urls.set(id, u); return u;
}
function hydrate(root){
  (root || document).querySelectorAll('[data-media]:not([data-h])').forEach(async el => {
    el.dataset.h = '1'; const u = await mediaUrl(el.dataset.media);
    if(!u){ el.classList.add('missing'); return; }
    if(el.tagName === 'IMG' || el.tagName === 'MODEL-VIEWER') el.setAttribute('src', u);
    else { el.style.backgroundImage = `url("${u}")`; el.textContent = ''; }
  });
}
function readImage(file, max, type){
  return new Promise((res, rej) => {
    if(!/^image\//.test(file.type)) return rej(new Error('not an image'));
    if(file.type === 'image/svg+xml' || file.type === 'image/gif') return res(file);
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
      const g = c.getContext('2d'); if(type !== 'image/png'){ g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => res(b || file), type || 'image/jpeg', 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('could not read image')); };
    im.src = u;
  });
}
function blobToDataURL(b){ return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
function dataURLToBlob(u){ const [m, d] = u.split(','); const mime = (m.match(/:(.*?);/) || [])[1] || 'application/octet-stream'; const bin = atob(d); const a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type: mime}); }

function motif(kind, st, fill, sw){
  if(kind === 'paisley') return `<path d="${PAISLEY}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/><circle cx="-6" cy="16" r="5" fill="none" stroke="${st}" stroke-width="${sw}"/><path d="M-14,30 q8,-6 16,0 M-18,38 q12,-8 26,0" fill="none" stroke="${st}" stroke-width="${sw}"/>`;
  if(kind === 'floral') return Array.from({length: 8}, (_, i) => `<ellipse cx="0" cy="-18" rx="7" ry="16" transform="rotate(${i * 45})" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`).join('') + `<circle r="7" fill="${st}"/>`;

function tile(kind, st, fill, sw, cols, rows, W, H, off){
  let s = ''; const dx = W / cols, dy = H / rows, sc = (Math.min(dx, dy) / 100).toFixed(3), o = (off || 0) % dx;
  for(let r = 0; r < rows; r++) for(let c = -2; c <= cols + 1; c++){ const x = (c + 0.5 + (r % 2 ? 0.5 : 0)) * dx + o, y = (r + 0.5) * dy; s += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${sc})">${motif(kind, st, fill, sw)}</g>`; }
  return s;
}

/* ---------------- migration (adds v2 data to older saves) ---------------- */
function migrate(){
  const s = DB.settings;
  const def = {logo: '', website: '', landline: '', pan: '', upiId: '', bank: ''};
  Object.keys(def).forEach(k => { if(s[k] === undefined) s[k] = def[k]; });
  DB.ack = DB.ack || {}; DB.notified = DB.notified || {};
  DB.designs = DB.designs || []; DB.msgLog = DB.msgLog || [];
  if(!DB.msgTemplates) DB.msgTemplates = defaultMsgTemplates();
  if(!DB.v2seeded){
    DB.v2seeded = true;
    if(DB.templates.some(t => t.id === 't_lehenga')) DB.designs.push(...demoDesigns().filter(d => tpl(d.tplId)));
    if(!s.logo && s.shop === 'Silk & Thread Couture'){ s.logo = demoLogo(); s.website = s.website || 'www.silkandthread.example'; s.upiId = s.upiId || 'silkandthread@upi'; }
    const o = DB.orders.find(x => x.no === 'ORD-1002'); if(o && o.items[1] && !o.items[1].designId) o.items[1].designId = 'd_jaal';
    const k = DB.orders.find(x => x.no === 'ORD-1003'); if(k && k.items[0] && !k.items[0].designId) k.items[0].designId = 'd_paisley';
  }
  DB.designs.forEach(d => ['stencils', 'samples', 'renders', 'spin', 'addComps', 'addTasks'].forEach(f => d[f] = d[f] || []));
}

function spinHTML(frames, id){
  return `<div class="spin" id="${id}" data-frames='${JSON.stringify(frames)}'><img alt="360 degree view" draggable="false"><div class="spin-ui"><button class="sm spin-play" onclick="spinPlay('${id}')">▶ Auto-rotate</button><input type="range" min="0" max="${frames.length - 1}" value="0" oninput="spinTo('${id}',+this.value)"><span class="muted" style="font-size:12px;white-space:nowrap">Drag to rotate · ${frames.length} frames</span></div></div>`;
}
function initSpins(root){
  (root || document).querySelectorAll('.spin:not([data-init])').forEach(async el => {
    el.dataset.init = '1'; const frames = JSON.parse(el.dataset.frames || '[]');
    const urls = await Promise.all(frames.map(mediaUrl)); el._urls = urls; el._i = 0;
    const img = el.querySelector('img'); img.src = urls[0] || '';
    urls.forEach(u => { if(u){ const p = new Image(); p.src = u; } });
    let down = null, start = 0;
    img.addEventListener('pointerdown', e => { down = e.clientX; start = el._i; try{ img.setPointerCapture(e.pointerId); }catch(_){} spinStop(el); e.preventDefault(); });
    img.addEventListener('pointermove', e => { if(down == null) return; const step = Math.max(4, img.clientWidth / (urls.length * 1.2)); spinSet(el, start + Math.round((down - e.clientX) / step)); });
    const up = () => { down = null; }; img.addEventListener('pointerup', up); img.addEventListener('pointercancel', up);
  });
}
function spinSet(el, i){ const n = el._urls.length; if(!n) return; i = ((i % n) + n) % n; el._i = i; el.querySelector('img').src = el._urls[i]; const r = el.querySelector('input[type=range]'); if(r) r.value = i; }
function spinTo(id, i){ const el = document.getElementById(id); if(el && el._urls){ spinStop(el); spinSet(el, i); } }
function spinStop(el){ if(el._t){ clearInterval(el._t); el._t = null; const b = el.querySelector('.spin-play'); if(b) b.textContent = '▶ Auto-rotate'; } }
function spinPlay(id){
  const el = document.getElementById(id); if(!el || !el._urls) return; if(el._t) return spinStop(el);
  el._t = setInterval(() => { if(!document.body.contains(el)){ clearInterval(el._t); return; } spinSet(el, el._i + 1); }, 90);
  el.querySelector('.spin-play').textContent = '⏸ Pause';
}

async function upMedia(did, field, inp){
  const d = design(did); const files = [...inp.files].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true})); inp.value = '';
  if(!files.length) return;
  if(field === 'spin' && d.spin.length + files.length > 72) return toast('Use at most 72 frames for a 360° view', 'bad');
  toast(`Processing ${files.length} file${files.length > 1 ? 's' : ''}…`);
  let n = 0;
  for(const f of files){
    try{
      if(field === 'model'){
        if(!/\.glb$/i.test(f.name)) throw new Error('3D model must be a .glb file');
        if(f.size > 25e6) throw new Error('model is larger than 25 MB');
        const id = uid('m'); await mediaPut(id, f); const old = d.model; d.model = id; mediaDel(old); n++; continue;
      }
      const blob = await readImage(f, field === 'spin' ? 1000 : 1400, field === 'stencils' ? 'image/png' : 'image/jpeg');
      const id = uid('m'); await mediaPut(id, blob); d[field].push(id); n++;
    }catch(e){ toast(`${f.name}: ${e.message}`, 'bad'); }
  }
  d.updated = nowISO(); save(); render(); if(n) toast(`${n} file${n > 1 ? 's' : ''} added`, 'ok');
  if(!MEDIA.db) toast('Browser storage for images is unavailable — images will be lost on reload', 'bad');
}

function setCover(did, id){ design(did).cover = id; save(); render(); toast('Cover image set', 'ok'); }
function rmModel(did){ const d = design(did); ask('Remove the 3D model?', () => { const id = d.model; d.model = ''; mediaDel(id); save(); render(); }); }
function clearSpin(did){ const d = design(did); ask(`Remove all ${d.spin.length} 360° frames?`, () => { const ids = d.spin; d.spin = []; ids.forEach(mediaDel); save(); render(); }); }
function lightbox(did, field, j, back){

function clearDesign(i){ const it = EDIT.items[i]; it.designId = ''; it.components = it.components.filter(c => !c.fromDesign); it.tasks = it.tasks.filter(t => !t.fromDesign || t.status !== 'pending'); render(); }

/* ---------------- communication ---------------- */
const EVENTS = {order_created: 'Order confirmed', trial: 'Trial / fitting reminder', delay: 'Delay notice', ready: 'Ready for pickup', delivered: 'Delivered – thank you', invoice: 'Invoice & payment', payment_reminder: 'Payment reminder', general: 'General / festive greeting', admin_alert: 'Admin alert (to admin)'};
const PH = ['customer_name', 'customer_first', 'order_no', 'items', 'designs', 'order_date', 'promised_date', 'tentative_date', 'total', 'paid', 'balance', 'invoice_no', 'shop_name', 'shop_mobile', 'shop_address', 'shop_website', 'upi_id', 'today', 'alert_title', 'alert_detail'];
let COMMS_TAB = 'templates', COMMS_SEL = 0, CMP = null;
function defaultMsgTemplates(){
  const M = (id, name, event, channel, auto, body) => ({id, name, event, channel, auto, active: true, body});
  return [
    M('m_conf_wa', 'Order confirmation', 'order_created', 'whatsapp', true, 'Namaste {customer_first}! 🙏\nThank you for choosing {shop_name}. Your order {order_no} ({items}) is confirmed.\nPromised delivery: {promised_date}\nOrder value: ₹{total} · Paid: ₹{paid} · Balance: ₹{balance}\nFor any change, call us on {shop_mobile}.'),
    M('m_conf_sms', 'Order confirmation (SMS)', 'order_created', 'sms', false, '{shop_name}: Order {order_no} confirmed. Delivery by {promised_date}. Balance Rs {balance}. Call {shop_mobile}'),
    M('m_trial', 'Trial / fitting reminder', 'trial', 'whatsapp', false, 'Hi {customer_first}, your trial for order {order_no} ({items}) is ready. Please visit {shop_name}, {shop_address}, at your convenience, or call {shop_mobile} to book a time.'),
    M('m_delay', 'Delay notice', 'delay', 'whatsapp', false, 'Dear {customer_first}, we are giving your {items} (order {order_no}) a little extra care. The revised delivery date is {tentative_date}. We regret the inconvenience. – {shop_name}'),
    M('m_ready', 'Ready for pickup', 'ready', 'whatsapp', true, 'Good news, {customer_first}! ✨ Your order {order_no} is ready for pickup at {shop_name}.\nBalance due: ₹{balance} (UPI: {upi_id}).\nSee you soon!'),
    M('m_deliv', 'Thank you after delivery', 'delivered', 'whatsapp', true, 'Thank you {customer_first} for collecting order {order_no}. We hope you love it! Free alterations within 7 days. Do share a photo with us 💐\n{shop_name} · {shop_website}'),
    M('m_inv', 'Invoice & payment details', 'invoice', 'whatsapp', false, 'Dear {customer_first}, invoice {invoice_no} for order {order_no}: total ₹{total}, paid ₹{paid}, balance ₹{balance}.\nPay by UPI to {upi_id}. Thank you! – {shop_name}'),
    M('m_pay_sms', 'Payment reminder (SMS)', 'payment_reminder', 'sms', false, '{shop_name}: Gentle reminder, Rs {balance} is pending for order {order_no}. UPI {upi_id}. Call {shop_mobile}'),
    M('m_fest', 'Festive greeting', 'general', 'whatsapp', false, 'Warm festive wishes from all of us at {shop_name}, {customer_first}! 🪔 Our new festive collection is in — drop by or call {shop_mobile} to book a fitting.'),
    M('m_admin', 'Bottleneck alert to admin', 'admin_alert', 'whatsapp', false, '⚠ {shop_name} production alert\n{alert_title}\n{alert_detail}')
  ];
}
function msgCtx(o, c, extra){
  const s = ST(), T = o ? orderTotals(o) : null, est = o && o.status === 'open' ? sched().O[o.id] : null, iv = o && o.invoiceId ? inv(o.invoiceId) : null;
  const n = x => num(x).toLocaleString('en-IN', {minimumFractionDigits: num(x) % 1 ? 2 : 0, maximumFractionDigits: 2});
  return Object.assign({customer_name: c?.name || '', customer_first: (c?.name || '').split(' ')[0], order_no: o?.no || '', items: o ? o.items.map(i => i.title).join(', ') : '', designs: o ? o.items.map(i => design(i.designId)?.name).filter(Boolean).join(', ') : '', order_date: o ? fmtD(o.created) : '', promised_date: o ? fmtD(o.promised) : '', tentative_date: est ? fmtD(est.delivery) : (o ? fmtD(o.promised) : ''), total: T ? n(T.total) : '', paid: T ? n(T.paid) : '', balance: T ? n(Math.max(0, T.bal)) : '', invoice_no: iv?.no || '', shop_name: s.shop, shop_mobile: s.phone, shop_address: s.address, shop_website: s.website || '', upi_id: s.upiId || '', today: fmtD(todayISO()), alert_title: '', alert_detail: ''}, extra || {});
}
const fillMsg = (body, ctx) => String(body || '').replace(/\{(\w+)\}/g, (m, k) => k in ctx ? ctx[k] : m);
function smsLink(phone, text){ let d = String(phone || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d; return `sms:${d ? '+' + d : ''}?body=${encodeURIComponent(text)}`; }
function smsInfo(t){ const uni = /[^\x00-\x7F]/.test(t), per = uni ? (t.length > 70 ? 67 : 70) : (t.length > 160 ? 153 : 160), seg = Math.max(1, Math.ceil(t.length / per)); return `${t.length} characters · ${seg} SMS part${seg > 1 ? 's' : ''}${uni ? ' (Unicode — emoji and ₹ shorten each SMS part)' : ''}`; }
function adminMsg(a){ const t = DB.msgTemplates.find(x => x.event === 'admin_alert' && x.active !== false); const o = a.oid ? ord(a.oid) : null; return fillMsg(t ? t.body : '⚠ {shop_name}: {alert_title}\n{alert_detail}', msgCtx(o, o ? cust(o.customerId) : null, {alert_title: a.title, alert_detail: a.detail})); }
function autoMsg(oid, ev){ const t = DB.msgTemplates.find(x => x.event === ev && x.active !== false && x.auto); if(t) openCompose(oid, ev, null, t.id); }
function openCompose(oid, ev, cid, tplId){
  const o = oid ? ord(oid) : null, c = cust(cid || o?.customerId); if(!c) return toast('No customer for this message', 'bad');
  const list = DB.msgTemplates.filter(t => t.active !== false && t.event !== 'admin_alert');
  const t = list.find(x => x.id === tplId) || list.find(x => x.event === ev) || list[0];
  CMP = {oid: o?.id || null, cid: c.id, tplId: t?.id || ''};
  const txt = t ? fillMsg(t.body, msgCtx(o, c)) : '';
  openModal(`<div class="mbar"><b>Message ${h(c.name)}</b>${o ? `<span class="muted">· ${h(o.no)}</span>` : ''}${ev && EVENTS[ev] ? `<span class="chip c-acc">${h(EVENTS[ev])}</span>` : ''}<span class="sp"></span><button onclick="closeModal()">Close</button></div>
  <div class="row"><div class="f"><label>Preset</label><select id="cmpTpl" onchange="cmpTpl(this.value)">${list.map(x => opt(x.id, `${x.name} · ${x.channel === 'sms' ? 'SMS' : x.channel === 'both' ? 'WhatsApp + SMS' : 'WhatsApp'}`, CMP.tplId)).join('')}</select></div><div class="f" style="max-width:220px"><label>Mobile</label><input id="cmpTo" value="${v(c.phone)}" oninput="cmpLinks()"></div></div>
  <div style="margin-top:10px"><label>Message (edit before sending)</label><textarea id="cmpText" rows="8" oninput="cmpLinks()">${h(txt)}</textarea><div class="hint" id="cmpCount"></div></div>
  <div class="row" style="margin-top:10px"><a class="btn pri" id="cmpWA" target="_blank" rel="noopener" onclick="logSend('WhatsApp')">💬 Open in WhatsApp</a><a class="btn" id="cmpSMS" target="_blank" rel="noopener" onclick="logSend('SMS')">✉ Open in SMS</a><button onclick="copyText('cmpText');logSend('Copied')">📋 Copy</button></div>
  <div class="hint">WhatsApp / SMS opens on this device with the message filled in — you press send. Fully automatic sending needs an SMS or WhatsApp Business API provider.</div>`);
  cmpLinks();
}
function cmpTpl(id){ const t = DB.msgTemplates.find(x => x.id === id); CMP.tplId = id; const o = CMP.oid ? ord(CMP.oid) : null; document.getElementById('cmpText').value = fillMsg(t.body, msgCtx(o, cust(CMP.cid))); cmpLinks(); }
function cmpLinks(){ const txt = document.getElementById('cmpText').value, to = document.getElementById('cmpTo').value; document.getElementById('cmpWA').href = waLink(to, txt); document.getElementById('cmpSMS').href = smsLink(to, txt); document.getElementById('cmpCount').textContent = smsInfo(txt); }
function logSend(ch){
  const txt = document.getElementById('cmpText').value, t = DB.msgTemplates.find(x => x.id === CMP.tplId);
  DB.msgLog.push({id: uid('ml'), at: nowISO(), orderId: CMP.oid, customerId: CMP.cid, to: document.getElementById('cmpTo').value, channel: ch, tplId: CMP.tplId, tplName: t?.name || 'Custom', text: txt});
  const o = CMP.oid && ord(CMP.oid); if(o) o.log.push({at: nowISO(), kind: 'msg', msg: `${ch === 'Copied' ? 'Message copied' : ch + ' message opened'}: ${t?.name || 'custom'}`});
  save(); if(ch === 'Copied') return; toast(`${ch} opened — logged in Communication`, 'ok');
}
function vComms(){
  const L = DB.msgTemplates, k = Math.max(0, Math.min(COMMS_SEL, L.length - 1)), t = L[k];
  const head = `<div class="row"><div><h1>Communication</h1><div class="sub">Preset SMS and WhatsApp messages. Order details fill in automatically; messages open in WhatsApp or SMS ready to send.</div></div><span class="sp"></span><button onclick="quickCompose()">💬 New message</button></div>
  <div class="tabs">${[['templates', `Message presets (${L.length})`], ['log', `Sent log (${DB.msgLog.length})`]].map(([x, l]) => `<button class="${COMMS_TAB === x ? 'pri' : ''}" onclick="COMMS_TAB='${x}';render()">${l}</button>`).join('')}</div>`;
  if(COMMS_TAB === 'log') return head + commsLog();
  const sampleO = DB.orders.find(o => o.status === 'open') || DB.orders[0];
  return head + `<div class="comms"><div class="card" style="padding:8px">${L.map((x, j) => `<div class="tli ${j === k ? 'on' : ''}" onclick="COMMS_SEL=${j};render()"><b>${h(x.name)}</b><div class="muted" style="font-size:12px">${h(EVENTS[x.event] || x.event)} · ${x.channel === 'both' ? 'WhatsApp + SMS' : x.channel === 'sms' ? 'SMS' : 'WhatsApp'}${x.auto ? ' · auto-prompt' : ''}${x.active === false ? ' · <span class="danger">off</span>' : ''}</div></div>`).join('')}<button class="sm" style="margin:8px" onclick="addMsgTpl()">+ New preset</button></div>
  ${t ? `<div class="card">
    <div class="row"><div class="f"><label>Preset name</label><input data-root="DB" data-p="msgTemplates.${k}.name" value="${v(t.name)}"></div><div class="f"><label>Used for</label><select data-root="DB" data-p="msgTemplates.${k}.event" data-r>${Object.entries(EVENTS).map(([e, l]) => opt(e, l, t.event)).join('')}</select></div><div class="f s"><label>Channel</label><select data-root="DB" data-p="msgTemplates.${k}.channel" data-r>${opt('whatsapp', 'WhatsApp', t.channel)}${opt('sms', 'SMS', t.channel)}${opt('both', 'Both', t.channel)}</select></div></div>
    <div class="row" style="margin-top:10px;align-items:center"><label class="inline"><input type="checkbox" data-root="DB" data-p="msgTemplates.${k}.auto" ${t.auto ? 'checked' : ''} data-r> Offer to send when this event happens</label><label class="inline"><input type="checkbox" data-root="DB" data-p="msgTemplates.${k}.active" ${t.active !== false ? 'checked' : ''} data-r> Active</label><span class="sp"></span><button class="sm" onclick="dupMsgTpl(${k})">Duplicate</button><button class="sm danger" onclick="rmMsgTpl(${k})">Delete</button></div>
    <div style="margin-top:10px"><label>Message text</label><textarea id="tplBody" rows="7" data-root="DB" data-p="msgTemplates.${k}.body" oninput="commsPrev()">${h(t.body)}</textarea></div>
    <div style="margin-top:6px"><span class="muted" style="font-size:12px">Insert field: </span>${PH.map(p => `<button class="sm ph" onclick="insPh('{${p}}')">{${p}}</button>`).join('')}</div>
    <h3 style="margin-top:16px">Preview${sampleO ? ` · filled with ${h(sampleO.no)}` : ''}</h3><div id="tplPrev" class="msg-prev"></div><div class="hint" id="tplCount"></div>
    <div class="hint">Auto-prompt events: order saved → “Order confirmed”, marked ready → “Ready for pickup”, delivered → “Delivered – thank you”. Delay notices are offered on at-risk orders; invoice messages from the invoice window.</div></div>` : '<div class="card">No presets.</div>'}</div>`;
}
function commsLog(){
  const L = DB.msgLog.slice().reverse();
  return `<div class="card">${L.length ? `<div class="row" style="margin-bottom:8px"><span class="sp"></span><button class="sm ghost danger" onclick="ask('Clear the message log?',()=>{DB.msgLog=[];save();render()})">Clear log</button></div><table><thead><tr><th>When</th><th>Customer</th><th>Order</th><th>Channel</th><th>Preset</th><th>Message</th></tr></thead><tbody>
  ${L.map(m => { const o = m.orderId && ord(m.orderId); return `<tr><td class="muted" style="white-space:nowrap">${fmtDT(m.at)}</td><td>${h(cust(m.customerId)?.name || '—')}<div class="muted" style="font-size:11.5px">${h(m.to)}</div></td><td>${o ? `<a href="#order-${o.id}">${h(o.no)}</a>` : '—'}</td><td><span class="chip ${m.channel === 'WhatsApp' ? 'c-ok' : m.channel === 'SMS' ? 'c-info' : 'c-mut'}">${h(m.channel)}</span></td><td>${h(m.tplName)}</td><td style="max-width:420px;font-size:12.5px;white-space:pre-wrap">${h(m.text.length > 220 ? m.text.slice(0, 220) + '…' : m.text)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">No messages yet. Messages opened from orders, customers or here are logged automatically.</div>'}</div>`;
}
function commsPrev(){
  const el = document.getElementById('tplBody'); if(!el) return;
  const o = DB.orders.find(x => x.status === 'open') || DB.orders[0];
  const txt = fillMsg(el.value, msgCtx(o, o ? cust(o.customerId) : null, {alert_title: 'Stage bottleneck', alert_detail: 'Embroidery queue is 3.1 working days (43 h across 2 workers).'}));
  document.getElementById('tplPrev').textContent = txt; document.getElementById('tplCount').textContent = smsInfo(txt);
}
function insPh(p){ const el = document.getElementById('tplBody'); if(!el) return; const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? s; el.value = el.value.slice(0, s) + p + el.value.slice(e); el.focus(); el.selectionStart = el.selectionEnd = s + p.length; el.dispatchEvent(new Event('input', {bubbles: true})); }
function addMsgTpl(){ DB.msgTemplates.push({id: uid('m'), name: 'New preset', event: 'general', channel: 'whatsapp', auto: false, active: true, body: 'Hi {customer_first}, '}); COMMS_SEL = DB.msgTemplates.length - 1; save(); render(); }
function dupMsgTpl(k){ const t = clone(DB.msgTemplates[k]); t.id = uid('m'); t.name += ' (copy)'; DB.msgTemplates.push(t); COMMS_SEL = DB.msgTemplates.length - 1; save(); render(); }
function rmMsgTpl(k){ ask(`Delete preset “${DB.msgTemplates[k].name}”?`, () => { DB.msgTemplates.splice(k, 1); COMMS_SEL = 0; save(); render(); }); }
function quickCompose(){
  if(!DB.customers.length) return toast('Add a customer first', 'bad');
  openModal(`<div class="mbar"><b>New message</b><span class="sp"></span><button onclick="closeModal()">Close</button></div><div class="row"><div class="f"><label>Customer</label><select id="qcC" onchange="qcOrders()">${DB.customers.slice().sort((a, b) => a.name.localeCompare(b.name)).map(c => opt(c.id, c.name)).join('')}</select></div><div class="f"><label>Order (optional)</label><select id="qcO"></select></div></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="pri" onclick="openCompose(document.getElementById('qcO').value||null,null,document.getElementById('qcC').value)">Continue</button></div>`);
  qcOrders();
}
function qcOrders(){ const cid = document.getElementById('qcC').value; document.getElementById('qcO').innerHTML = opt('', '— none —') + DB.orders.filter(o => o.customerId === cid).map(o => opt(o.id, `${o.no} · ${statusLabel(o)}`)).join(''); }

/* ---------------- backup with images ---------------- */
async function exportData(withMedia){
  const data = clone(DB);
  if(withMedia){
    toast('Packing images…'); data._media = {}; const ids = new Set();
    DB.designs.forEach(d => [...d.stencils, ...d.samples, ...d.renders, ...d.spin, d.model].forEach(x => { if(x && !x.startsWith('demo:')) ids.add(x); }));
    for(const id of ids){ const b = await mediaGet(id); if(b) data._media[id] = await blobToDataURL(b); }
  }
  const json = JSON.stringify(data);
  if(IN_FRAME){
    openModal(`<div class="mbar"><b>Backup data (JSON)${withMedia ? ' with images' : ''}</b><span class="sp"></span><button onclick="copyText('bk')">📋 Copy</button><button onclick="closeModal()">Close</button></div><div class="hint" style="margin-bottom:8px">Downloads are blocked in the shared viewer. Copy this text and save it as a .json file to back up or move your data (${(json.length / 1e6).toFixed(1)} MB).</div><textarea id="bk" rows="16" readonly style="font-family:ui-monospace,monospace;font-size:11px">${h(json.length > 3e6 ? json.slice(0, 3e6) : json)}</textarea>${json.length > 3e6 ? '<div class="hint danger">Too large to show here — export without images, or open the app as a local file to download.</div>' : ''}`);
    return;
  }
  const b = new Blob([json], {type: 'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = `boutique-backup-${todayISO()}${withMedia ? '-with-images' : ''}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => {
    try{
      const x = JSON.parse(r.result); if(!x.settings || !x.orders) throw new Error('Not a backup file');
      ask('Replace all current data with this backup?', async () => {
        const media = x._media || {}; delete x._media; DB = x; migrate();
        for(const [id, u] of Object.entries(media)) await mediaPut(id, dataURLToBlob(u));
        save(); render(); toast('Backup imported', 'ok');
      });
    }catch(e){ toast('Import failed: ' + e.message, 'bad'); }
  };
  r.readAsText(f); inp.value = '';
}

/* ---------------- boot ---------------- */
DB = load() || seed();
migrate(); save();
mediaOpen().then(() => { render(); setTimeout(checkNotify, 600); });
setInterval(() => { if(route().v !== 'edit' && !document.getElementById('modal').classList.contains('on')){ render(); checkNotify(); } }, 5 * 60 * 1000);
</script>
